<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPC-16</title>
<style>
:root{
  --chassis:#1b1a18; --chassis2:#242220; --pad:#3a3733; --pad-hi:#514c45;
  --amber:#e8a33d; --amber-dim:#7a5a24; --teal:#3fa9a0; --text:#e9e4da; --muted:#9a948a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --chassis:#d9d4c9; --chassis2:#c9c3b6; --pad:#efe9dd; --pad-hi:#fff; --text:#26231f; --muted:#5c574e; }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; min-height:100%; background:var(--chassis2); color:var(--text);
  font-family:"Sans-serif","Helvetica Neue",Arial,sans-serif; display:flex; align-items:center; justify-content:center;
  padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px)); padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
}
.unit{
  background:var(--chassis); border-radius:14px; padding:22px; width:100%; max-width:640px;
  box-shadow:0 20px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
}
.top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; flex-wrap:wrap; gap:8px;}
.brand{font-weight:700; letter-spacing:.02em; font-size:1.3rem;}
.brand span{color:var(--amber);}
.sub{color:var(--muted); font-size:.8rem;}
.controls{display:flex; gap:14px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
.controls label{font-size:.75rem; color:var(--muted); display:flex; align-items:center; gap:6px;}
input[type=range]{accent-color:var(--amber); width:110px;}
button.reset{
  background:transparent; border:1px solid var(--pad-hi); color:var(--text); border-radius:7px;
  padding:6px 12px; font-size:.75rem; cursor:pointer;
}
button.reset:hover{border-color:var(--amber); color:var(--amber);}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.pad{
  position:relative; aspect-ratio:1/1; background:var(--pad); border-radius:10px; border:none;
  color:var(--text); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:6px; overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .04s ease;
}
.pad:active, .pad.hit{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
.pad.hit{ background:var(--amber-dim); }
.pad .key{ font-size:.65rem; color:var(--muted); position:absolute; top:6px; left:8px; }
.pad .name{ font-size:.72rem; font-weight:600; text-align:center; padding:0 4px; }
.pad .loaded{ font-size:.6rem; color:var(--teal); margin-top:2px; max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pad input[type=file]{ display:none; }
.pad .load-btn{
  position:absolute; bottom:5px; right:6px; font-size:.62rem; color:var(--muted); background:none; border:none; cursor:pointer;
}
.pad .load-btn:hover{ color:var(--amber); }
.pad.dragover{ outline:2px dashed var(--amber); }
.hint{ margin-top:14px; font-size:.72rem; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>
<div class="unit">
  <div class="top">
    <div class="brand">MPC<span>-16</span></div>
    <div class="sub">clavier azerty/qwerty jouable — clique le petit "+" d'un pad pour charger ton propre son</div>
  </div>
  <div class="controls">
    <label>Volume <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></label>
    <button class="reset" id="resetBtn">Réinitialiser le kit</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Glisse-dépose un fichier audio directement sur un pad pour le remplacer. Chaque pad garde son échantillon jusqu'à ce que tu recharges la page ou cliques sur "Réinitialiser".</div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioCtx();
const master = ctx.createGain();
master.gain.value = 0.9;
master.connect(ctx.destination);
document.getElementById('vol').addEventListener('input', e => master.gain.value = parseFloat(e.target.value));

// ---- Noise buffer helper ----
function noiseBuffer(duration){
  const n = ctx.sampleRate * duration;
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return buf;
}

// ---- Synthesized default kit (no external audio files) ----
function kick(t){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.15);
  g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.4);
}
function snare(t){
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.2);
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.8,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  src.connect(hp); hp.connect(g); g.connect(master); src.start(t);
  const o=ctx.createOscillator(); const g2=ctx.createGain();
  o.type='triangle'; o.frequency.value=180; g2.gain.setValueAtTime(0.5,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.15);
}
function hihat(t, open){
  const dur = open?0.4:0.08;
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(dur);
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(hp); hp.connect(g); g.connect(master); src.start(t);
}
function clap(t){
  for(let i=0;i<3;i++){
    const dt = t + i*0.02;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.08);
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5,dt); g.gain.exponentialRampToValueAtTime(0.001,dt+0.08);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(dt);
  }
}
function tom(t, freq){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.6,t+0.25);
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.32);
}
function rim(t){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='square'; o.frequency.value=1800;
  g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
}
function cowbell(t){
  const g = ctx.createGain(); g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  [800,540].forEach(f=>{
    const o=ctx.createOscillator(); o.type='square'; o.frequency.value=f; o.connect(g);
    o.start(t); o.stop(t+0.3);
  });
  g.connect(master);
}
function shaker(t){
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.12);
  const bp = ctx.createBiquadFilter(); bp.type='highpass'; bp.frequency.value=5000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t);
}
function crash(t){
  const src = ctx.createBufferSource(); src.buffer = noiseBuffer(1.2);
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
  src.connect(hp); hp.connect(g); g.connect(master); src.start(t);
}
function perc(t, freq, dur){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}

const PADS = [
  {key:'1', name:'Kick',        fn:t=>kick(t)},
  {key:'2', name:'Snare',       fn:t=>snare(t)},
  {key:'3', name:'HH Fermé',    fn:t=>hihat(t,false)},
  {key:'4', name:'HH Ouvert',   fn:t=>hihat(t,true)},
  {key:'q', name:'Clap',        fn:t=>clap(t)},
  {key:'w', name:'Tom Grave',   fn:t=>tom(t,110)},
  {key:'e', name:'Tom Médium',  fn:t=>tom(t,160)},
  {key:'r', name:'Tom Aigu',    fn:t=>tom(t,220)},
  {key:'a', name:'Rimshot',     fn:t=>rim(t)},
  {key:'s', name:'Cowbell',     fn:t=>cowbell(t)},
  {key:'d', name:'Shaker',      fn:t=>shaker(t)},
  {key:'f', name:'Crash',       fn:t=>crash(t)},
  {key:'z', name:'Perc 1',      fn:t=>perc(t,300,0.15)},
  {key:'x', name:'Perc 2',      fn:t=>perc(t,420,0.12)},
  {key:'c', name:'Perc 3',      fn:t=>perc(t,540,0.1)},
  {key:'v', name:'Perc 4',      fn:t=>perc(t,660,0.08)},
];

const state = PADS.map(p => ({ buffer:null, name:null, defaultFn:p.fn }));

function playPad(i){
  const now = ctx.currentTime + 0.01;
  const s = state[i];
  if(s.buffer){
    const src = ctx.createBufferSource();
    src.buffer = s.buffer;
    src.connect(master);
    src.start(now);
  } else {
    s.defaultFn(now);
  }
  flash(i);
}

function flash(i){
  const el = document.querySelector(`[data-i="${i}"]`);
  el.classList.add('hit');
  setTimeout(()=>el.classList.remove('hit'), 100);
}

async function loadFile(i, file){
  const arr = await file.arrayBuffer();
  try{
    const buf = await ctx.decodeAudioData(arr);
    state[i].buffer = buf;
    state[i].name = file.name;
    document.querySelector(`[data-i="${i}"] .loaded`).textContent = file.name;
  }catch(err){
    alert("Impossible de lire ce fichier audio.");
  }
}

const grid = document.getElementById('grid');
PADS.forEach((p, i) => {
  const pad = document.createElement('div');
  pad.className = 'pad';
  pad.dataset.i = i;
  pad.innerHTML = `
    <span class="key">${p.key.toUpperCase()}</span>
    <span class="name">${p.name}</span>
    <span class="loaded"></span>
    <button class="load-btn" title="Charger un échantillon">+</button>
    <input type="file" accept="audio/*">
  `;
  const fileInput = pad.querySelector('input[type=file]');
  pad.querySelector('.load-btn').addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  fileInput.addEventListener('click', e => e.stopPropagation());
  fileInput.addEventListener('change', e => { if(e.target.files[0]) loadFile(i, e.target.files[0]); });
  pad.addEventListener('click', () => { ctx.resume(); playPad(i); });
  pad.addEventListener('dragover', e => { e.preventDefault(); pad.classList.add('dragover'); });
  pad.addEventListener('dragleave', () => pad.classList.remove('dragover'));
  pad.addEventListener('drop', e => {
    e.preventDefault(); pad.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if(f) loadFile(i, f);
  });
  grid.appendChild(pad);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state.forEach((s,i) => { s.buffer=null; s.name=null; document.querySelector(`[data-i="${i}"] .loaded`).textContent=''; });
});

const keyMap = {};
PADS.forEach((p,i) => keyMap[p.key] = i);
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k in keyMap){ ctx.resume(); playPad(keyMap[k]); }
});
</script>
</body>
</html>
